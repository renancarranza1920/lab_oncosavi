# Usar junto a docker-compose.yml; conserva los volúmenes y servicios existentes.
services:
  app:
    env_file:
      - .env
      - .env.whatsapp

  n8n:
    image: n8nio/n8n:2.41.6
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 1.0
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env.whatsapp
    environment:
      GENERIC_TIMEZONE: America/El_Salvador
      TZ: America/El_Salvador
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_SSRF_ALLOWED_HOSTNAMES: whatsapp
      N8N_PAYLOAD_SIZE_MAX: 12
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 2
    entrypoint: ["/bin/sh", "/bootstrap/start.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n:/bootstrap:ro
    networks:
      - oncosavi_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  whatsapp:
    build:
      context: ./docker/whatsapp
    image: lab-oncosavi-whatsapp:1.0
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 0.75
    environment:
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:?Ejecute primero python3 docker/whatsapp/configurar.py}
    volumes:
      - whatsapp_session:/data
    networks:
      - oncosavi_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  n8n_data:
  whatsapp_session:
