name: lab-oncosavi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: lab-oncosavi-app:1.0

    restart: unless-stopped

    env_file:
      - .env

    environment:
      CHATBOT_LOCAL_MODEL: ${CHATBOT_LOCAL_MODEL:-qwen3:1.7b}
      CHATBOT_OLLAMA_URL: http://ollama:11434

    ports:
      - "127.0.0.1:8000:80"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - laravel_storage:/var/www/html/storage

    networks:
      - oncosavi_network

  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: 5m
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - oncosavi_network

  ollama-init:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${CHATBOT_LOCAL_MODEL:-qwen3:1.7b}"]
    restart: "on-failure:3"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - oncosavi_network

  db:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql
      - ./oncosavi.sql:/docker-entrypoint-initdb.d/01-oncosavi.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - oncosavi_network

volumes:
  mysql_data:
  laravel_storage:
  ollama_models:

networks:
  oncosavi_network:
    driver: bridge
